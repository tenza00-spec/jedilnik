<style>

  --accent:#a9adf0; --accent-ink:#17151a; --soft:#2b2c45; --lunch:#2e2522; --warn:#e7a08c; --chip:#2a262e; color-scheme:dark}}

  function mirrorDB() {
    if(!window.indexedDB)return Promise.resolve(null);
    if(mirrorDBPromise)return mirrorDBPromise;
    mirrorDBPromise=new Promise(function(resolve){
      var req;
      try{req=window.indexedDB.open('moj-jedilnik-mirror',1);}catch(e){resolve(null);return;}
      req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains('backup'))req.result.createObjectStore('backup');};
      req.onsuccess=function(){resolve(req.result);};
      req.onerror=function(){resolve(null);};
      req.onblocked=function(){resolve(null);};
    });
    return mirrorDBPromise;
  }

        if(!db)return;
        try{
          var transaction=db.transaction('backup','readwrite');
          transaction.objectStore('backup').put({json:json,savedAt:new Date().toISOString()},'latest');
        }catch(e){}
      }).catch(function(){});
    },500);
  }

          req.onsuccess=function(){resolve(req.result||null);};

        }catch(e){resolve(null);}
      });
    }).catch(function(){return null;});
  }

  function weekMonday() { var n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }

  // Neznanih hranil NE štejemo kot nič. Vrednosti živil so na 100 g/ml oziroma na enoto.
  var NUTRIENT_KEYS=['fat','carbs','fiber','sugars'];
  function knownNutrient(obj,key) {
    if(!obj || obj[key]===null || obj[key]===undefined || obj[key]==='')return null;
    var n=Number(obj[key]);return Number.isFinite(n)&&n>=0?n:null;
  }

  }
  function itemNutrient(it,key) {
    if(!it)return null;

      var v=sm?partsNutrient(sm.parts,key):null;
      return v===null?null:v*(+it.q||0)/(Number(sm.servingGrams)||300);
    }
    if(it.f){var fd=food(it.f),v=knownNutrient(fd,key);return fd&&v!==null?v*(+it.q||0)/per(fd.unit):null;}
    return knownNutrient(it,key);

  }

  // ---------- persistence ----------
  function save() {
    localRev++;
    if (local) {
      try {
        snapshotWeek();
        var previous=localStorage.getItem(LKEY);
        if (previous) {try{localStorage.setItem(LKEY+'-backup',previous);}catch(e){/* Primarni zapis ima prednost pred rezervnim. */}}
        var payload=JSON.stringify(S);
        localStorage.setItem(LKEY,payload);scheduleMirror(payload);setStatus('Shranjeno na tej napravi');
      }
      catch (e) { setStatus('Ni shranjeno: brskalnik ne dovoli shranjevanja (zasebni način?).'); }
      setTimeout(function () { if (/^Shranjeno/.test($('status').textContent)) setStatus(''); }, 1500);
      return;
    }
    snapshotWeek();
    if (!docRef) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);
    setStatus('Shranjujem …');
  }
  function flush() {
    saveTimer = null;
    if (writing) return; // the running write re-checks when it finishes
    writing = true;
    var rev = localRev;
    docRef.set(JSON.parse(JSON.stringify(S))).then(function () {
      savedRev = rev; lastErr = false;
      if (localRev === savedRev) { setStatus('Shranjeno'); setTimeout(function () { if ($('status').textContent === 'Shranjeno') setStatus(''); }, 1500); }
    }).catch(function (e) {
      lastErr = true;
      setStatus('Ni shranjeno: ' + ((e && e.code) === 'permission_denied' ? 'nimaš pravice urejanja.' : 'ni povezave. Poskusim znova ob naslednji spremembi.'));
    }).then(function () {
      writing = false;
      if (!lastErr && localRev !== savedRev && !saveTimer) flush();
    });
  }
  function change(fn, undoMsg) {

  }
  function toast(msg) {

  }

  function smoothieValues(parts) {

      var q=Number(v.q);if(!isFinite(q)||q<=0){valid=false;return;}

  function barcodeGTIN(raw) {
    var code=String(raw||'').trim();
    if(!/^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/.test(code))return false;
    var digits=code.split('').map(Number), check=digits.pop(), total=0;
    for(var i=digits.length-1,m=3;i>=0;i--,m=(m===3?1:3))total+=digits[i]*m;
    return (10-total%10)%10===check;
  }
  function barcodeFinite(v,max) {
    if(v==null || v==='')return null;
    var n=Number(v);
    return Number.isFinite(n)&&n>=0&&n<=max?n:null;
  }
  function barcodeNormalize(response,code) {
    var p=response&&response.product;
    if(!p || typeof p!=='object' || response.status===0 || response.status==='failure' || (!p.product_name && !p.product_name_sl && !p.nutriments && !p.nutrition))return null;
    var n=p.nutriments||{},ag=p.nutrition&&p.nutrition.aggregated_set&&p.nutrition.aggregated_set.nutrients||{};
    function nutrient(field,max) {
      var key=field+'_100g', nvalue=barcodeFinite(n[key],max);
      if(nvalue!==null)return nvalue;
      var entry=(p.nutrition&&p.nutrition.aggregated_set && /^(100g|100ml)$/.test(p.nutrition.aggregated_set.per||''))?ag[field]:null;
      if(entry && entry.value!=null && entry.unit && (entry.unit==='g'||field.indexOf('energy')===0)) {
        var parsed=barcodeFinite(entry.value,max);
        if(parsed!==null)return parsed;
      }
      return null;
    }
    var kcal=nutrient('energy-kcal',1000),protein=nutrient('proteins',100),
        fat=nutrient('fat',100),carbs=nutrient('carbohydrates',100),
        fiber=nutrient('fiber',100),sugars=nutrient('sugars',100);
    if(kcal===null) {
      var kj=nutrient('energy-kj',4184);
      if(kj!==null)kcal=Math.round(kj/4.184*10)/10;
    }
    var quantity=String(p.quantity||'').slice(0,100);
    var unit=(p.product_quantity_unit==='ml'||(/\b\d+\s?(ml|l)\b/i).test(quantity))?'ml':'g';
    return {
      code:code,
      name:String(p.product_name_sl||p.product_name||p.product_name_en||'').slice(0,180),
      brand:String(p.brands||'').slice(0,120),
      quantity:quantity,
      kcal:kcal,protein:protein,fat:fat,carbs:carbs,fiber:fiber,sugars:sugars,
      unit:unit,saveUnit:'g',gramsPer100ml:100,gramsPerPiece:null,cat:'Moje',origin:'Open Food Facts',verification:false
    };
  }
  function barcodeManualProduct(code) {
    return {code:code,name:'',brand:'',quantity:'',kcal:null,protein:null,fat:null,
      carbs:null,fiber:null,sugars:null,unit:'g',saveUnit:'g',gramsPer100ml:100,gramsPerPiece:null,cat:'Moje',origin:'Ročno iz embalaže',verification:false};
  }
  function barcodeNutritionOK(v) {
    return !!v && String(v.name||'').trim().length>1 &&
      barcodeFinite(v.kcal,1000)!==null && barcodeFinite(v.protein,100)!==null &&
      (v.unit==='g'||v.unit==='ml');
  }

      return fmtN(barcodeAmount)+' '+existing.unit+' → ~'

    }
    if(!barcodeNutritionOK(b))return 'Vnesi ime, kalorije in beljakovine na 100 g ali 100 ml.';
    var unit=b.saveUnit==='kos'?'kos':'g',base=b.unit==='ml'?Number(b.gramsPer100ml):100,
        weight=unit==='kos'?Number(b.gramsPerPiece):100;
    if(!Number.isFinite(base)||base<20||base>200)return 'Za 100 ml vnesi maso med 20 in 200 g.';
    if(!Number.isFinite(weight)||weight<=0||weight>2000)return 'Vnesi maso enega kosa v gramih.';
    var total=(barcodeAmount||0)*weight/base;
    return fmtN(barcodeAmount)+' '+unit+' → ~'
      +Math.round(b.kcal*total)+' kcal · '
      +fmtN(Math.round(b.protein*total*10)/10)+' g beljakovin'
      +(b.unit==='ml'?' (pretvorba iz 100 ml)':'');
  }

  function barcodeCameraStop() {
    barcodeCameraToken++;
    barcodeCameraActive=false;barcodeCameraLoading=false;
    var reader=barcodeReader;barcodeReader=null;
    if(!reader)return Promise.resolve();
    return Promise.resolve().then(function(){return reader.stop();}).catch(function(){})
      .then(function(){return reader.clear();}).catch(function(){});
  }
  function barcodeScript() {
    if(window.Html5Qrcode && window.Html5QrcodeSupportedFormats)return Promise.resolve();
    if(barcodeScript.loading)return barcodeScript.loading;
    barcodeScript.loading=new Promise(function(resolve,reject){
      var script=document.createElement('script');
      script.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      script.async=true;
      script.onload=function(){if(window.Html5Qrcode)resolve();else reject(new Error('Knjižnice ni mogoče zagnati.'));};
      script.onerror=function(){reject(new Error('Skeniranja ni mogoče naložiti.'));};
      document.head.appendChild(script);
    }).catch(function(error){barcodeScript.loading=null;throw error;});
    return barcodeScript.loading;
  }
  function barcodeNewReader() {
    var F=window.Html5QrcodeSupportedFormats;
    return new window.Html5Qrcode('barcode-reader',{
      formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A],verbose:false
    });
  }
  function barcodeStartCamera() {
    if(!barcodeOpen || barcodeCameraLoading || barcodeCameraActive)return;
    if(!window.isSecureContext){barcodeError='Za kamero odpri aplikacijo prek HTTPS (npr. GitHub Pages). Kodo lahko tudi vtipkaš.';render();return;}
    barcodeCameraLoading=true;barcodeError='';render();
    var token=++barcodeCameraToken;
    barcodeScript().then(function(){
      if(token!==barcodeCameraToken || !barcodeOpen || view!=='info')return;
      var reader=barcodeNewReader();barcodeReader=reader;
      return reader.start({facingMode:'environment'},{fps:8},function(code){
        if(token!==barcodeCameraToken || barcodeBusy || !barcodeOpen)return;
        if(!barcodeGTIN(code))return;
        barcodeInput=String(code);barcodeCameraStop();barcodeLookup(code);
      },function(){}).then(function(){
        if(token!==barcodeCameraToken || !barcodeOpen || view!=='info'){
          return Promise.resolve(reader.stop()).catch(function(){}).then(function(){return reader.clear();}).catch(function(){});
        }
      });
    }).then(function(){
      if(token!==barcodeCameraToken)return;
      barcodeCameraLoading=false;barcodeCameraActive=true;
      var status=$('barcodeInput');if(status)status.setAttribute('aria-label','Kamera je aktivna. Črtno kodo postavi na sredino.');
    }).catch(function(error){
      if(token!==barcodeCameraToken)return;
      barcodeCameraStop();barcodeError='Kamera ni na voljo: '+String(error&&error.message||error)+'. Uporabi fotografijo ali ročni vnos.';
      if(barcodeOpen&&view==='info')render();
    });
  }
  function barcodePhotoLookup(file) {
    if(!file||!barcodeOpen)return;
    if(!/^image\//.test(file.type||'')){barcodeError='Izberi fotografijo črtne kode.';render();return;}
    barcodeError='';barcodeCameraLoading=true;
    barcodeCameraStop().then(function(){barcodeCameraLoading=true;render();return barcodeScript();}).then(function(){
      if(!barcodeOpen||view!=='info')return;
      var reader=barcodeNewReader();barcodeReader=reader;
      return reader.scanFile(file,true).then(function(code){
        barcodeReader=null;reader.clear();
        barcodeInput=String(code);barcodeLookup(code);
      }).catch(function(e){
        barcodeReader=null;try{reader.clear();}catch(err){}
        throw e;
      });
    }).catch(function(error){
      barcodeError='Na fotografiji ni bilo mogoče prebrati črtne kode. Poskusi bližje ali kodo vnesi ročno.';
      barcodeCameraLoading=false;
      if(barcodeOpen && view==='info')render();
    });
  }
  function barcodeLookup(raw) {
    var code=String(raw==null?barcodeInput:raw).replace(/\s+/g,'');
    if(!barcodeOpen)return;
    barcodeInput=code;
    if(!barcodeGTIN(code)){barcodeResult=null;barcodeError='Vnesi veljavno EAN/UPC kodo z 8, 12, 13 ali 14 številkami (s pravilno kontrolno števko).';render();return;}
    if(barcodeBusy)return;
    barcodeBusy=true;barcodeError='';barcodeResult=null;barcodeAmount=100;barcodeEaten=false;
    var requestId=++barcodeRequestSeq;
    barcodeCameraStop();render();
    var url='https://world.openfoodfacts.org/api/v3/product/'+encodeURIComponent(code)+'?fields=code,product_name,product_name_sl,product_name_en,brands,quantity,product_quantity_unit,nutriments,nutrition_data_per,nutrition&lc=sl';
    var controller=typeof AbortController==='function'?new AbortController():null;
    var options={headers:{'Accept':'application/json'}};
    if(controller)options.signal=controller.signal;
    var timeout=setTimeout(function(){if(controller)controller.abort();},12000);
    return fetch(url,options).then(function(resp){
      if(resp.status===404)return null;
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      return resp.json();
    }).then(function(json){
      if(!barcodeOpen||requestId!==barcodeRequestSeq)return;
      barcodeResult=barcodeNormalize(json,code) || barcodeManualProduct(code);
      barcodeError=barcodeResult.origin==='Open Food Facts'?'Izdelek najden. Preveri in po potrebi popravi podatke.':'Izdelka ni v bazi; vnesi podatke z embalaže.';
    }).catch(function(error){
      if(!barcodeOpen||requestId!==barcodeRequestSeq)return;
      barcodeResult=barcodeManualProduct(code);
      barcodeError='Podatkov ni bilo mogoče pridobiti ('+(error&&error.name==='AbortError'?'časovna omejitev':'povezava ni uspela')+'). Podatke lahko vneseš ročno s pakiranja.';
    }).finally(function(){
      clearTimeout(timeout);if(requestId!==barcodeRequestSeq)return;
      barcodeBusy=false;if(barcodeOpen&&view==='info')render();
    });
  }
  function barcodeSaveFood(addMeal) {
    if(!barcodeResult || (!barcodeExisting() && !barcodeNutritionOK(barcodeResult))) {
      barcodeError='Pred shranjevanjem vnesi ime, kcal in beljakovine na 100 g/ml ter preveri enoto.';render();return;
    }
    var amount=Number(barcodeAmount);
    if(addMeal && (!Number.isFinite(amount)||amount<=0||amount>10000)){
      barcodeError='Vnesi veljavno količino med 0 in 10.000 g oziroma kosov.';render();return;
    }
    var idx=barcodeDayIdx==null?dayIdx:barcodeDayIdx,day=S.days[idx],meal=day&&day.meals.filter(function(m){return m.id===barcodeMealId;})[0];
    if(addMeal && !meal){barcodeError='Izberi obrok.';render();return;}
    if(addMeal && barcodeEaten && dateOfIdx(idx)>dKey(new Date())) {
      barcodeError='Pri prihodnjem dnevu lahko živilo samo načrtuješ, ne pa že označiš kot pojedeno.';render();return;
    }
    var existing=barcodeExisting(),b=barcodeResult,unit=existing?existing.unit:(b.saveUnit==='kos'?'kos':'g'),quantity=Math.round(amount*100)/100;
    var base=existing?100:(b.unit==='ml'?Number(b.gramsPer100ml):100),
      mass=unit==='kos'&&!existing?Number(b.gramsPerPiece):100;
    if(!existing && (!Number.isFinite(base)||base<20||base>200||!Number.isFinite(mass)||mass<=0||mass>2000)){
      barcodeError='Za pretvorbo potrebujem veljavno maso 100 ml oziroma maso enega kosa. Podatki niso shranjeni.';render();return;
    }
    function converted(key){return b[key]==null?null:Math.round(Number(b[key])*mass/base*1e6)/1e6;}
    if(!existing && ['fat','carbs','fiber','sugars'].some(function(k){return b[k]!=null&&barcodeFinite(b[k],100)===null;})){
      barcodeError='Preveri dodatne hranilne vrednosti: vnos mora biti med 0 in 100 g/100 g ali ml.';render();return;
    }
    var displayName=String(b.name).trim(),brand=String(b.brand||'').trim();
    if(brand && displayName.toLowerCase().indexOf(brand.toLowerCase())===-1)displayName=brand+' – '+displayName;
    var fId=existing?existing.id:nid('f'), date=dateOfIdx(idx);
    change(function(){
      if(!existing){
        S.foods.push({id:fId,barcode:b.code,label:displayName,cat:b.cat||'Moje',
          unit:unit,kcal:converted('kcal'),p:converted('protein'),def:unit==='kos'?1:100,
          fat:converted('fat'),carbs:converted('carbs'),fiber:converted('fiber'),sugars:converted('sugars'),
          gramPerPiece:unit==='kos'?mass:null,massReview:unit==='kos'?'userMass':b.unit==='ml'?'approx':null,
          legacyUnit:b.unit==='ml'?'ml':null,legacyGramFactor:unit==='kos'?mass:b.unit==='ml'?base/100:null,
          brand:brand,source:b.origin,verified:!!b.verification});
      }
      if(addMeal) {
        var item={id:nid('i'),extra:true,addedOn:date,f:fId,q:quantity,note:'Skenirana črtna koda '+b.code};
        if(barcodeEaten)item.eatenOn=date;
        var swap=S.daySwaps&&S.daySwaps[date]&&S.daySwaps[date][meal.id];
        (swap?swap.items:meal.items).push(item);
      }
      S.recentFoodIds=[fId].concat(S.recentFoodIds.filter(function(x){return x!==fId;})).slice(0,12);
      barcodeResult=null;barcodeInput='';barcodeError='';barcodeOpen=false;barcodeRequestSeq++;barcodeCameraStop();
      if(addMeal){dayIdx=idx;view='teden';editing=false;}else{view='info';foodQ=existing?existing.label:displayName;editing=false;}
    },addMeal?'Živilo dodano k obroku':'Živilo shranjeno');
  }


  // Pri uvozu druge kopije preveri razliko med predhodnimi in novimi nastavitvami enot.
  var STATIC_UNIT_OVERRIDES={};
  function applyStaticUserUnits(){
    var wanted=S.foodUnitOverrides||{},old=STATIC_UNIT_OVERRIDES,
      ids=Object.keys(old).concat(Object.keys(wanted));
    ids.forEach(function(id,i){
      if(ids.indexOf(id)!==i)return;
      var base=PIECE_FOODS.indexOf(id)>=0?'kos':'g',
        from=old[id]||{unit:base},to=wanted[id]||{unit:base};
      if(from.unit===to.unit)return;
      var gram=Number(from.gramsPerPiece||to.gramsPerPiece);
      if(!Number.isFinite(gram)||gram<=0)return;
      var scale=from.unit==='g'?1/gram:gram;
      function conv(parts){
        (parts||[]).forEach(function(p){
          if(p.f===id)p.q=Math.round((+p.q||0)*scale*1e5)/1e5;
        });
      }
      SMALL_PARTS.forEach(conv);
      Object.keys(LEGACY_SMOOTHIE_SHOP).forEach(function(k){conv(LEGACY_SMOOTHIE_SHOP[k]);});
    });
    STATIC_UNIT_OVERRIDES=JSON.parse(JSON.stringify(wanted));
  }
  function changeFoodUnit(fd,unit) {
    if(unit===fd.unit)return;
    if(unit!=='kos'&&unit!=='g')return;
    var old=fd.unit;
    if(old!=='g'&&old!=='kos'){setStatus('Podprti enoti sta g in kos.');render();return;}
    var suggested=Number(fd.gramPerPiece||fd.legacyGramFactor)||60;
    var raw=window.prompt('Koliko gramov tehta en kos izdelka »'+fd.label+'«? Ta podatek potrebujem, da ne spremenim kalorij že shranjenih obrokov.',String(suggested));
    if(raw==null){render();return;}
    var grams=Number(String(raw).replace(',','.'));
    if(!Number.isFinite(grams)||grams<1||grams>2000){setStatus('Masa enega kosa mora biti med 1 in 2000 g. Enota ni spremenjena.');render();return;}
    var qtyScale=old==='g'?1/grams:grams,
      nutrientScale=old==='g'?grams/100:100/grams;
    change(function(){
      ['kcal','p','fat','carbs','fiber','sugars'].forEach(function(k){
        if(fd[k]!=null && fd[k]!=='')fd[k]=Math.round(Number(fd[k])*nutrientScale*1e6)/1e6;
      });
      function conv(parts){if(Array.isArray(parts))parts.forEach(function(x){if(x.f===fd.id)x.q=Math.round((+x.q||0)*qtyScale*1e5)/1e5;});}
      (S.smoothies||[]).forEach(function(sm){conv(sm.parts);});
      function convItem(it){
        if(it.f===fd.id)it.q=Math.round((+it.q||0)*qtyScale*1e5)/1e5;
        conv(it.parts);
      }
      (S.days||[]).forEach(function(d){d.meals.forEach(function(m){m.items.forEach(convItem);});});
      Object.keys(S.daySwaps||{}).forEach(function(day){Object.keys(S.daySwaps[day]||{}).forEach(function(mid){
        var swap=S.daySwaps[day][mid];if(swap&&Array.isArray(swap.items))swap.items.forEach(convItem);
      });});
      var pantry=S.pantry&&S.pantry[fd.id];
      if(pantry)['q','pack'].forEach(function(k){if(pantry[k]!=null)pantry[k]=Math.round((+pantry[k]||0)*qtyScale*1e5)/1e5;});
      fd.def=unit==='kos'?Math.max(1,Math.round((+fd.def||100)*qtyScale)):Math.round((+fd.def||1)*qtyScale*100)/100;
      fd.unit=unit;
      fd.gramPerPiece=grams;
      fd.massReview='userMass';
      if(!S.foodUnitOverrides)S.foodUnitOverrides={};
      var base=PIECE_FOODS.indexOf(fd.id)>=0?'kos':'g';
      if(unit===base)delete S.foodUnitOverrides[fd.id];
      else S.foodUnitOverrides[fd.id]={unit:unit,gramsPerPiece:grams};
      applyStaticUserUnits();
      // Ne briši shranjenih kljukic; povezane so z enoto in količino.
    },'Enota in količine v receptih varno preračunane');
  }


  // ---------- batch recipes: raw ingredients, cooked yield, measured serving ----------
  function newBatchDraft() {
    return {id:'',name:'',parts:[{f:'',q:100}],yieldGrams:'',portionGrams:'',mealId:''};
  }
  function batchTotals(recipe) {
    var k=0,p=0,valid=!!(recipe.parts&&recipe.parts.length);
    (recipe.parts||[]).forEach(function(part){
      var f=food(part.f),q=Number(String(part.q).replace(',','.'));
      if(!f||!Number.isFinite(q)||q<=0){valid=false;return;}
      k+=(+f.kcal||0)*q/per(f.unit);
      p+=(+f.p||0)*q/per(f.unit);
    });
    return {k:k,p:p,valid:valid};
  }
  function batchPortion(recipe) {
    var t=batchTotals(recipe),yieldGrams=Number(String(recipe.yieldGrams).replace(',','.')),portionGrams=Number(String(recipe.portionGrams).replace(',','.'));
    var valid=t.valid&&Number.isFinite(yieldGrams)&&yieldGrams>0&&Number.isFinite(portionGrams)&&portionGrams>0&&portionGrams<=yieldGrams;
    return {valid:valid,k:valid?t.k*portionGrams/yieldGrams:0,p:valid?t.p*portionGrams/yieldGrams:0,percent:valid?100*portionGrams/yieldGrams:0,total:t};
  }

  function renderFoods() {
    var complete=S.foods.filter(function(x){return ['fat','carbs','fiber'].every(function(k){return knownNutrient(x,k)!==null;});}).length;
    var uncertain=S.foods.filter(function(x){return x.massReview==='approx'||x.massReview==='countApprox';}).length;

  function plannedShoppingItems() {
    var totals={}, unknown=[], options=S.shopAutoOptions||{}, seenUnknown={},nextWeek=+options.weekOffset===1;
    function noteUnknown(label,day) {
      var msg=(day ? day+': ' : '')+label;
      if(!seenUnknown[msg]){unknown.push(msg);seenUnknown[msg]=true;}
    }
    function addFoodPart(id,q,why) {
      var f=food(id),value=Number(q);
      if(!f || !isFinite(value) || value<=0){noteUnknown('Neznana sestavina '+id,why);return;}
      if(id.indexOf('s:')===0) {
        var sm=S.smoothies.filter(function(x){return 's:'+x.id===id;})[0];
        if(!sm){noteUnknown('Neznan smuti '+id,why);return;}
        var seedSm=null;
        try{seedSm=JSON.parse($('seed').textContent).smoothies.filter(function(x){return x.id===sm.id;})[0];}catch(e){}
        var legacySafe=!!(seedSm && seedSm.ing===sm.ing);
        var parts=Array.isArray(sm.parts)&&sm.parts.length ? sm.parts : (legacySafe?LEGACY_SMOOTHIE_SHOP[sm.id]:null);
        if(!parts || !parts.length){noteUnknown('Smuti brez strukturiranega recepta: '+sm.n,why);return;}
        // it.q of a smoothie is the total prepared mass in grams, not servings.
        // Multiply ingredients by the fraction of one recipe, never by raw grams.
        var recipeMass=Number(sm.servingGrams);
        if(!Number.isFinite(recipeMass)||recipeMass<=0){
          recipeMass=parts.reduce(function(sum,p){return sum+Math.max(0,Number(p.q)||0);},0);
        }
        if(!Number.isFinite(recipeMass)||recipeMass<=0){
          noteUnknown('Ni podatka o masi smutija: '+sm.n,why);return;
        }
        parts.forEach(function(x){addFoodPart(x.f,(+x.q||0)*value/recipeMass,why+' / '+sm.n);});
        return;
      }
      // Nakupuješ surove sestavine, medtem ko je del načrta zapisan s kuhano/pečeno težo.
      // Razmerja so orientacijska; realni izkoristek je odvisen od priprave.
      var conversions={
        polak:{f:'polak_s',ratio:4/3},
        piscanec:{f:'piscanec_s',ratio:4/3},
        riz:{f:'x_riz_suha_teza',ratio:1/3},
        x_testenine_kuhane:{f:'testenine_s',ratio:1/2.25},
        krompir:{f:'krompir_s',ratio:1},
        krompirP:{f:'krompir_s',ratio:1}
      };
      var conv=conversions[id];
      if(conv && food(conv.f)){
        id=conv.f;value=value*conv.ratio;f=food(id);
        why+=' (ocena količine pred pripravo)';
      }
      if(!totals[id])totals[id]={f:id,label:f.label,cat:f.cat||CATMAP[id]||'Moje',unit:f.unit,q:0,reasons:[]};
      totals[id].q+=value;
      if(totals[id].reasons.indexOf(why)===-1)totals[id].reasons.push(why);
    }
    S.days.forEach(function(d,di){
      (d.meals||[]).forEach(function(m){
        if(m.lunch && !options.includeLunch)return;
        (nextWeek?m.items.filter(function(it){return !it.extra;}):visibleMealItems(m,di)).forEach(function(it){
          if(it.extra && !options.includeExtras)return;
          var why=d.name.replace(/\s*\(.*\)$/,'')+' / '+m.name;
          if(Array.isArray(it.parts)&&it.parts.length) {
            it.parts.forEach(function(p){addFoodPart(p.f,p.q,why);});return;
          }
          if(it.f) {addFoodPart(it.f,+it.q||0,why);return;}
          // Prejšnje različice so shranile alternative samo kot opis.
          var matched=SMALL_OPTIONS.filter(function(o){return it.n && it.n.indexOf(o[1]+' (')===0;})[0];
          if(!matched && /^(Polak s pirejem|Aljaški saj s pirejem) \(/.test(it.n||''))matched=SMALL_OPTIONS[18];
          if(matched){smallParts(matched).forEach(function(p){addFoodPart(p.f,p.q,why);});return;}
          if(it.n)noteUnknown(it.n,why);
        });
      });
    });
    if(totals.pire)noteUnknown('Pire krompir: za pripravo iz surovin preveri količino krompirja, mleka in smetane.', '');
    var list=Object.keys(totals).map(function(id){return totals[id];});
    list.sort(function(a,b){var c=catOrder(a.cat)-catOrder(b.cat);return c||a.label.localeCompare(b.label,'sl');});
    return {items:list,unknown:unknown};
  }

  // Samodejni seznam vodi notranje količine v g/kos, kupovalcu pa jih
  // prikaže v ustreznih trgovinskih enotah. Primer: 2.060 g mleka = 2 l.
  var SHOP_LIQUID_DENSITIES={
    mleko:1.03,x_mleko_1_5:1.03,x_kefir:1.03,
    x_pomarancni_sok:1.04,x_coca_cola:1.04,x_pivo:1.01,
    x_sladka_smetana_35:1,x_goveja_juha_bistra:1,
    olje:0.91,x_oljcno_olje:0.91,
    x_sojina_omaka:1.15,x_balzamicni_kis:1.01
  };
  function shopUnitSpec(x){
    if(x.unit==='kos')return {unit:'kos',factor:1,decimals:2};
    var density=SHOP_LIQUID_DENSITIES[x.f];
    if(density){
      // Mleko, kefir, sokovi in pijače v litrih, manjše količine olja/omak v ml.
      var liters=['mleko','x_mleko_1_5','x_kefir','x_pomarancni_sok','x_coca_cola','x_pivo'].indexOf(x.f)>=0;
      return {unit:liters?'l':'ml',factor:density*(liters?1000:1),decimals:liters?2:0,approx:density!==1};
    }
    return x.unit==='g' && x.q>=1000
      ? {unit:'kg',factor:1000,decimals:2}
      : {unit:'g',factor:1,decimals:0};
  }
  function shopRound(value,digits){
    var factor=Math.pow(10,digits);

  function shopQtyText(x,value){

  function shopInputAmount(x,value){

  // Okvirne nakupne embalaže iz obstoječega ročnega seznama; osebni vnosi imajo prednost.
  var SHOP_DEFAULT_PACKS={

  function packageCount(x) {

  function renderAutoShop() {
    var result=plannedShoppingItems(),items=result.items,
      needed=items.filter(function(x){return stillToBuy(x)>0;}),
      done=needed.filter(autoShopDone).length;
    var mon=new Date(weekMonday());mon.setDate(mon.getDate()+(+S.shopAutoOptions.weekOffset===1?7:0));

    try { saved = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (!isValidBackup(saved)) saved=null; } catch (e) {}
    if (!saved) { try { var old=JSON.parse(localStorage.getItem(LKEY+'-backup') || 'null'); if (isValidBackup(old)) {saved=old;setStatus('Obnovljena rezervna lokalna kopija.');} } catch(e) {} }
    try { S = saved || JSON.parse($('seed').textContent); } catch (e) { S = null; }
    if (!S || !S.days) { showEmpty('Jedilnika ni bilo mogoče naložiti.'); return; }
    prep();
    if (migratedNow && saved) { try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch (e) {} }
    $('nav').hidden = false;
    if (msg) { $('mode').textContent = msg; $('mode').hidden = false; }
    render();
    if(!saved)recoverMirrorIfNeeded();
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  localMode('');
  // Bližnjica na iPhonu ostane ista. Ob HTTPS obisku shrani samo statično lupino za delo brez omrežja.
  if(window.location && window.location.protocol==='https:' && navigator.serviceWorker && window.addEventListener){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});
    });
  }
})();
</script>
