<style>
/* Layout: one-column phone app, sticky day strip, fixed bottom tab bar; cards only for meals and list rows */
:root{
  --bg:#fbf8f6; --surface:#ffffff; --ink:#2b2730; --muted:#7a7380; --line:#ece6ea;
  --accent:#7b7fd4; --accent-ink:#ffffff; --soft:#eceefc; --lunch:#fdf1ea; --warn:#c0705a; --chip:#f4f0f3;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151a; --surface:#211e25; --ink:#ece8ef; --muted:#a59fab; --line:#322e37;
  --accent:#a9adf0; --accent-ink:#17151a; --soft:#2b2c45; --lunch:#2e2522; --warn:#e7a08c; --chip:#2a262e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151a; --surface:#211e25; --ink:#ece8ef; --muted:#a59fab; --line:#322e37;
  --accent:#a9adf0; --accent-ink:#17151a; --soft:#2b2c45; --lunch:#2e2522; --warn:#e7a08c; --chip:#2a262e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(32px + env(safe-area-inset-bottom, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:16px 4px}
h1{font:800 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
h2{font:700 20px/1.2 var(--display);margin:20px 0 10px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:700}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.edit-toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.edit-toggle[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.medit{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;color:var(--accent)}
.medit[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.mh .rt{display:flex;align-items:center;gap:8px}.meal-totals{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}.meal-totals .subtle{font-size:11px;white-space:nowrap}.item-energy{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.item-energy small{font-size:11px;color:var(--muted)}.barcode-reader{width:100%;min-height:40px;border-radius:12px;overflow:hidden}.barcode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.barcode-grid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.barcode-grid input,.barcode-grid select{width:100%;min-width:0}.barcode-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.barcode-actions button{flex:1 1 138px}.barcode-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.barcode-status{font-size:12px;line-height:1.5;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none;margin:0 -4px;padding-inline:4px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:56px}
.strip button b{font-size:15px}.strip button small{font-size:11px;color:var(--muted)}
.strip button.on{background:var(--soft);border-color:var(--accent);color:var(--ink)}.strip button.on small{color:var(--accent)}
.strip button.today:not(.on){border-color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gauge{margin:4px 0 14px}
.gauge .bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.gauge .fill{height:100%;background:var(--accent);border-radius:99px}
.gauge .band{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.gauge .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.gauge .lbl b{color:var(--ink)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.meal.lunch{background:var(--lunch)}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mh .nm{font-weight:700}.mh .kc{font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px}
.items{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.items li{display:flex;justify-content:space-between;gap:8px;font-size:15px;flex-wrap:wrap;align-items:center}.items li .it{flex:1 1 160px}.actualqty{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}.actualqty input{width:72px;padding:5px 6px;text-align:right}
.items li span{min-width:0}.items li em{font-style:normal;color:var(--muted);white-space:nowrap;font-size:14px}
.erow{display:flex;gap:6px;align-items:center;margin-top:6px}
.erow input,.erow textarea,.field{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:16px}
.erow .n{flex:1}.erow .k{width:76px;text-align:right}.erow .p{width:76px;text-align:right}
.x{border:0;background:var(--chip);border-radius:9px;width:36px;height:36px;flex:0 0 auto;font-size:18px;line-height:1;color:var(--warn)}
.add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--accent);margin-top:8px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card p{margin:6px 0 0;font-size:15px}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 9px;font-size:13px;color:var(--muted);margin:6px 6px 0 0}
.steps,.tips{margin:6px 0;padding-left:22px}.steps li,.tips li{margin:4px 0;font-size:15px}
.note{color:var(--muted);font-size:14px}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px}
.row .cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);flex:0 0 auto;display:grid;place-items:center;margin-top:1px;padding:0}
.row .cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row .cb svg{width:16px;height:16px}
.row .txt{flex:1;min-width:0}.row .txt small{display:block;color:var(--muted);font-size:13px}
.row .pr{color:var(--muted);font-size:14px;white-space:nowrap}
.row.done .txt{text-decoration:line-through;opacity:.5}
.ed{display:flex;flex-direction:column;gap:6px;width:100%}
.ed .two{display:flex;gap:6px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.totals div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.totals small{display:block;color:var(--muted);font-size:12px}.totals b{font:700 20px var(--display)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.status{font-size:13px;color:var(--muted);min-height:18px;margin-top:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);margin-top:20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:4px;padding-block:8px;margin-top:6px}
nav .seg{display:flex;gap:4px;background:var(--chip);border-radius:14px;padding:4px;flex:1}
nav button{flex:1;border:0;background:none;padding:7px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:19px;height:19px}
nav button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(60,40,70,.08)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:9;max-width:calc(100% - 32px)}
.meal .items li{align-items:flex-start}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:0 0 auto;padding:0;display:grid;place-items:center;margin-top:1px}
.tick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tick svg{width:12px;height:12px}
.it{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0}
.it .lab{flex:1;min-width:0}.it .lab small{display:block;color:var(--muted);font-size:13px}
li.eaten .lab{color:var(--muted)}
.xtag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-left:4px}
.mini{border:0;background:none;color:var(--warn);font-size:18px;line-height:1;padding:0 2px}
.eitem{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.eitem:first-of-type{border-top:0}
.eitem .two{display:flex;gap:6px;align-items:center}
.eitem select{flex:1;min-width:0}
.unit{color:var(--muted);font-size:14px;min-width:64px}
.kv{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
.adder{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.adder .acts{display:flex;gap:8px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;font-size:15px}
.subtle{font-size:13px;color:var(--muted);margin-top:6px}
.mode{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);margin:6px 0 0}
.pg{display:block;color:var(--accent);font-size:12px;font-weight:600;text-align:right}
.water{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.wbar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 10px}
.wfill{height:100%;background:#8cc4e8;border-radius:99px}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.wbtn.minus{color:var(--muted)}
.whist{display:flex;gap:6px;margin-top:12px}
.wcol{flex:1;text-align:center}.wcol small{font-size:11px;color:var(--muted)}
.wc{height:40px;background:var(--chip);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.wc div{width:100%;background:#b9dcf2;border-radius:6px}.wc div.ok{background:#8cc4e8}
.wbtn small{color:var(--muted);font-weight:500;font-size:12px}
.dx{color:var(--warn);font-weight:700}
.dlog{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.dlog li{align-items:center}
.dlog li span{flex:1}
.water .two{display:flex;gap:8px;align-items:center}
.rec summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;font-weight:700}
.rec summary::-webkit-details-marker{display:none}
.rec summary .kc{font-weight:700}
.rec[open] summary{margin-bottom:6px}
.meter{margin:9px 0}.meterhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.metertrack{background:var(--chip);height:10px;border-radius:99px;overflow:hidden;margin:5px 0}.meterfill{background:var(--accent);height:100%;border-radius:99px}.pillbtn{border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:12px;background:var(--chip);font-weight:600}.pillbtn.active{background:var(--soft);border-color:var(--accent);color:var(--accent)}.portion{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 7px 29px}.smrow{display:grid;grid-template-columns:1fr 86px 34px;gap:6px;align-items:center;margin:7px 0}.smrow select,.smrow input{min-width:0}.chartwrap{overflow-x:auto;margin-top:12px}.barline{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}.barline span{display:block;height:100%;background:var(--accent)}nav .seg{overflow-x:auto;scrollbar-width:thin}nav button{min-width:68px;flex:1 0 68px}details.card summary{cursor:pointer}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast button{color:var(--accent-ink)}}
@media (prefers-reduced-motion: no-preference){.gauge .fill{transition:width .3s ease}}
</style>

  function smoothieValues(parts) {
    var kcal=0,protein=0, valid=true;

      var fd=food(v.f);if(!fd){valid=false;return;}
      if(v.f==='battery_whey' && (!(+fd.kcal) || !(+fd.p)))valid=false;
      var q=Number(v.q);if(!isFinite(q)||q<=0){valid=false;return;}
      var mult=q/per(fd.unit);
      kcal+=(+fd.kcal||0)*mult;protein+=(+fd.p||0)*mult;
    });
    return {k:Math.round(kcal),p:Math.round(protein*10)/10,valid:valid};
  }
  function smMacros(s) {

  // Skeniranje: kamera se aktivira samo po kliku in se izklopi ob zaprtju ali preklopu zavihka.
  function barcodeGTIN(raw) {
    var code=String(raw||'').trim();
    if(!/^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/.test(code))return false;
    var digits=code.split('').map(Number), check=digits.pop(), total=0;
    for(var i=digits.length-1,m=3;i>=0;i--,m=(m===3?1:3))total+=digits[i]*m;
    return (10-total%10)%10===check;
  }
  function barcodeFinite(v,max) {
    if(v==null || v==='')return null;
    var n=Number(v);
    return Number.isFinite(n)&&n>=0&&n<=max?n:null;
  }
  function barcodeNormalize(response,code) {
    var p=response&&response.product;
    if(!p || typeof p!=='object')return null;
    var n=p.nutriments||{},ag=p.nutrition&&p.nutrition.aggregated_set&&p.nutrition.aggregated_set.nutrients||{};
    function nutrient(field,max) {
      var key=field+'_100g', nvalue=barcodeFinite(n[key],max);
      if(nvalue!==null)return nvalue;
      var entry=(p.nutrition&&p.nutrition.aggregated_set && /^(100g|100ml)$/.test(p.nutrition.aggregated_set.per||''))?ag[field]:null;
      if(entry && entry.value!=null && entry.unit && (entry.unit==='g'||field.indexOf('energy')===0)) {
        var parsed=barcodeFinite(entry.value,max);
        if(parsed!==null)return parsed;
      }
      return null;
    }
    var kcal=nutrient('energy-kcal',1000),protein=nutrient('proteins',100),
        fat=nutrient('fat',100),carbs=nutrient('carbohydrates',100),
        fiber=nutrient('fiber',100),sugars=nutrient('sugars',100);
    if(kcal===null) {
      var kj=nutrient('energy-kj',4184);
      if(kj!==null)kcal=Math.round(kj/4.184*10)/10;
    }
    var quantity=String(p.quantity||'').slice(0,100);
    var unit=(p.product_quantity_unit==='ml'||(/\b\d+\s?(ml|l)\b/i).test(quantity))?'ml':'g';
    return {
      code:code,
      name:String(p.product_name_sl||p.product_name||p.product_name_en||'').slice(0,180),
      brand:String(p.brands||'').slice(0,120),
      quantity:quantity,
      kcal:kcal,protein:protein,fat:fat,carbs:carbs,fiber:fiber,sugars:sugars,
      unit:unit,cat:'Moje',origin:'Open Food Facts',verification:false
    };
  }
  function barcodeManualProduct(code) {
    return {code:code,name:'',brand:'',quantity:'',kcal:null,protein:null,fat:null,
      carbs:null,fiber:null,sugars:null,unit:'g',cat:'Moje',origin:'Ročno iz embalaže',verification:false};
  }
  function barcodeNutritionOK(v) {
    return !!v && String(v.name||'').trim().length>1 &&
      barcodeFinite(v.kcal,1000)!==null && barcodeFinite(v.protein,100)!==null &&
      (v.unit==='g'||v.unit==='ml');
  }

  function barcodeCameraStop() {
    barcodeCameraToken++;
    barcodeCameraActive=false;barcodeCameraLoading=false;
    var reader=barcodeReader;barcodeReader=null;
    if(!reader)return Promise.resolve();
    return Promise.resolve().then(function(){return reader.stop();}).catch(function(){})
      .then(function(){return reader.clear();}).catch(function(){});
  }
  function barcodeScript() {
    if(window.Html5Qrcode && window.Html5QrcodeSupportedFormats)return Promise.resolve();
    if(barcodeScript.loading)return barcodeScript.loading;
    barcodeScript.loading=new Promise(function(resolve,reject){
      var script=document.createElement('script');
      script.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      script.async=true;
      script.onload=function(){if(window.Html5Qrcode)resolve();else reject(new Error('Knjižnice ni mogoče zagnati.'));};
      script.onerror=function(){reject(new Error('Skeniranja ni mogoče naložiti.'));};
      document.head.appendChild(script);
    }).catch(function(error){barcodeScript.loading=null;throw error;});
    return barcodeScript.loading;
  }
  function barcodeNewReader() {
    var F=window.Html5QrcodeSupportedFormats;
    return new window.Html5Qrcode('barcode-reader',{
      formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false
    });
  }
  function barcodeStartCamera() {
    if(!barcodeOpen || barcodeCameraLoading || barcodeCameraActive)return;
    if(!window.isSecureContext){barcodeError='Za kamero odpri aplikacijo prek HTTPS (npr. GitHub Pages). Kodo lahko tudi vtipkaš.';render();return;}
    barcodeCameraLoading=true;barcodeError='';render();
    var token=++barcodeCameraToken;
    barcodeScript().then(function(){
      if(token!==barcodeCameraToken || !barcodeOpen || view!=='info')return;
      barcodeReader=barcodeNewReader();
      return barcodeReader.start({facingMode:'environment'},{fps:8},function(code){
        if(token!==barcodeCameraToken || barcodeBusy || !barcodeOpen)return;
        if(!barcodeGTIN(code))return;
        barcodeInput=String(code);barcodeCameraStop();barcodeLookup(code);
      },function(){});
    }).then(function(){
      if(token!==barcodeCameraToken){if(barcodeReader)barcodeCameraStop();return;}
      barcodeCameraLoading=false;barcodeCameraActive=true;
      var status=$('barcodeInput');if(status)status.setAttribute('aria-label','Kamera je aktivna. Črtno kodo postavi na sredino.');
    }).catch(function(error){
      if(token!==barcodeCameraToken)return;
      barcodeCameraStop();barcodeError='Kamera ni na voljo: '+String(error&&error.message||error)+'. Uporabi fotografijo ali ročni vnos.';
      if(barcodeOpen&&view==='info')render();
    });
  }
  function barcodePhotoLookup(file) {
    if(!file||!barcodeOpen)return;
    if(!/^image\//.test(file.type||'')){barcodeError='Izberi fotografijo črtne kode.';render();return;}
    barcodeError='';barcodeCameraLoading=true;
    barcodeCameraStop().then(function(){barcodeCameraLoading=true;render();return barcodeScript();}).then(function(){
      if(!barcodeOpen||view!=='zivila')return;
      var reader=barcodeNewReader();barcodeReader=reader;
      return reader.scanFile(file,true).then(function(code){
        barcodeReader=null;reader.clear();
        barcodeInput=String(code);barcodeLookup(code);
      }).catch(function(e){
        barcodeReader=null;try{reader.clear();}catch(err){}
        throw e;
      });
    }).catch(function(error){
      barcodeError='Na fotografiji ni bilo mogoče prebrati črtne kode. Poskusi bližje ali kodo vnesi ročno.';
      barcodeCameraLoading=false;
      if(barcodeOpen && view==='zivila')render();
    });
  }
  function barcodeLookup(raw) {
    var code=String(raw==null?barcodeInput:raw).replace(/\s+/g,'');
    barcodeInput=code;
    if(!barcodeGTIN(code)){barcodeError='Vnesi veljavno EAN/UPC kodo z 8, 12, 13 ali 14 številkami (s pravilno kontrolno števko).';render();return;}
    if(barcodeBusy)return;
    barcodeBusy=true;barcodeError='';barcodeResult=null;barcodeAmount=100;barcodeEaten=false;
    barcodeCameraStop();render();
    var url='https://world.openfoodfacts.org/api/v3/product/'+encodeURIComponent(code)+'?fields=code,product_name,product_name_sl,product_name_en,brands,quantity,product_quantity_unit,nutriments,nutrition_data_per,nutrition&lc=sl';
    var controller=typeof AbortController==='function'?new AbortController():null;
    var options={headers:{'Accept':'application/json'}};
    if(controller)options.signal=controller.signal;
    var timeout=setTimeout(function(){if(controller)controller.abort();},12000);
    return fetch(url,options).then(function(resp){
      if(resp.status===404)return null;
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      return resp.json();
    }).then(function(json){
      if(!barcodeOpen)return;
      barcodeResult=barcodeNormalize(json,code) || barcodeManualProduct(code);
      barcodeError=barcodeResult.origin==='Open Food Facts'?'Izdelek najden. Preveri in po potrebi popravi podatke.':'Izdelka ni v bazi; vnesi podatke z embalaže.';
    }).catch(function(error){
      if(!barcodeOpen)return;
      barcodeResult=barcodeManualProduct(code);
      barcodeError='Podatkov ni bilo mogoče pridobiti ('+(error&&error.name==='AbortError'?'časovna omejitev':'povezava ni uspela')+'). Podatke lahko vneseš ročno s pakiranja.';
    }).finally(function(){
      clearTimeout(timeout);barcodeBusy=false;
      if(barcodeOpen&&view==='zivila')render();
    });
  }
  function barcodeSaveFood(addMeal) {
    if(!barcodeResult || !barcodeNutritionOK(barcodeResult)) {
      barcodeError='Pred shranjevanjem vnesi ime, kcal in beljakovine na 100 g/ml ter preveri enoto.';render();return;
    }
    var amount=Number(barcodeAmount);
    if(addMeal && (!Number.isFinite(amount)||amount<=0||amount>10000)){
      barcodeError='Vnesi veljavno količino med 0 in 10.000 g/ml.';render();return;
    }
    var idx=barcodeDayIdx==null?dayIdx:barcodeDayIdx,day=S.days[idx],meal=day&&day.meals.filter(function(m){return m.id===barcodeMealId;})[0];
    if(addMeal && !meal){barcodeError='Izberi obrok.';render();return;}
    if(addMeal && barcodeEaten && dateOfIdx(idx)>dKey(new Date())) {
      barcodeError='Pri prihodnjem dnevu lahko živilo samo načrtuješ, ne pa že označiš kot pojedeno.';render();return;
    }
    var existing=barcodeExisting(),b=barcodeResult,unit=b.unit,quantity=Math.round(amount*100)/100;
    var displayName=String(b.name).trim(),brand=String(b.brand||'').trim();
    if(brand && displayName.toLowerCase().indexOf(brand.toLowerCase())===-1)displayName=brand+' – '+displayName;
    var fId=existing?existing.id:nid('f'), date=dateOfIdx(idx);
    change(function(){
      if(!existing){
        S.foods.push({id:fId,barcode:b.code,label:displayName,cat:b.cat||'Moje',
          unit:unit,kcal:Number(b.kcal),p:Number(b.protein),def:100,
          fat:b.fat,carbs:b.carbs,fiber:b.fiber,sugars:b.sugars,
          brand:brand,source:b.origin,verified:!!b.verification});
      }
      if(addMeal) {
        var item={id:nid('i'),extra:true,addedOn:date,f:fId,q:quantity,note:'Skenirana črtna koda '+b.code};
        if(barcodeEaten)item.eatenOn=date;
        var swap=S.daySwaps&&S.daySwaps[date]&&S.daySwaps[date][meal.id];
        (swap?swap.items:meal.items).push(item);
      }
      barcodeResult=null;barcodeInput='';barcodeError='';barcodeOpen=false;barcodeCameraStop();
      if(addMeal){dayIdx=idx;view='teden';editing=false;}else{view='info';foodQ=displayName;editing=false;}
    },addMeal?'Živilo dodano k obroku':'Živilo shranjeno');
  }

  function plannedShoppingItems() {
    var totals={}, unknown=[], options=S.shopAutoOptions||{}, seenUnknown={},nextWeek=+options.weekOffset===1;
    function noteUnknown(label,day) {
      var msg=(day ? day+': ' : '')+label;
      if(!seenUnknown[msg]){unknown.push(msg);seenUnknown[msg]=true;}
    }
    function addFoodPart(id,q,why) {
      var f=food(id),value=Number(q);
      if(!f || !isFinite(value) || value<=0){noteUnknown('Neznana sestavina '+id,why);return;}
      if(id.indexOf('s:')===0) {
        var sm=S.smoothies.filter(function(x){return 's:'+x.id===id;})[0];
        if(!sm){noteUnknown('Neznan smuti '+id,why);return;}
        var seedSm=null;
        try{seedSm=JSON.parse($('seed').textContent).smoothies.filter(function(x){return x.id===sm.id;})[0];}catch(e){}
        var legacySafe=!!(seedSm && seedSm.ing===sm.ing);
        var parts=Array.isArray(sm.parts)&&sm.parts.length ? sm.parts : (legacySafe?LEGACY_SMOOTHIE_SHOP[sm.id]:null);
        if(!parts || !parts.length){noteUnknown('Smuti brez strukturiranega recepta: '+sm.n,why);return;}
        parts.forEach(function(x){addFoodPart(x.f,(+x.q||0)*value,why+' / '+sm.n);});
        return;
      }
      // Nakupuješ surove sestavine, medtem ko je del načrta zapisan s kuhano/pečeno težo.
      // Razmerja so orientacijska; realni izkoristek je odvisen od priprave.
      var conversions={
        polak:{f:'polak_s',ratio:4/3},
        piscanec:{f:'piscanec_s',ratio:4/3},
        riz:{f:'x_riz_suha_teza',ratio:1/3},
        x_testenine_kuhane:{f:'testenine_s',ratio:1/2.25},
        krompir:{f:'krompir_s',ratio:1},
        krompirP:{f:'krompir_s',ratio:1}
      };
      var conv=conversions[id];
      if(conv && food(conv.f)){
        id=conv.f;value=value*conv.ratio;f=food(id);
        why+=' (ocena količine pred pripravo)';
      }
      if(!totals[id])totals[id]={f:id,label:f.label,cat:f.cat||CATMAP[id]||'Moje',unit:f.unit,q:0,reasons:[]};
      totals[id].q+=value;
      if(totals[id].reasons.indexOf(why)===-1)totals[id].reasons.push(why);
    }
    S.days.forEach(function(d,di){
      (d.meals||[]).forEach(function(m){
        if(m.lunch && !options.includeLunch)return;
        (nextWeek?m.items.filter(function(it){return !it.extra;}):visibleMealItems(m,di)).forEach(function(it){
          if(it.extra && !options.includeExtras)return;
          var why=d.name.replace(/\s*\(.*\)$/,'')+' / '+m.name;
          if(Array.isArray(it.parts)&&it.parts.length) {
            it.parts.forEach(function(p){addFoodPart(p.f,p.q,why);});return;
          }
          if(it.f) {addFoodPart(it.f,+it.q||0,why);return;}
          // Prejšnje različice so shranile alternative samo kot opis.
          var matched=SMALL_OPTIONS.filter(function(o){return it.n && it.n.indexOf(o[1]+' (')===0;})[0];
          if(!matched && /^(Polak s pirejem|Aljaški saj s pirejem) \(/.test(it.n||''))matched=SMALL_OPTIONS[18];
          if(matched){smallParts(matched).forEach(function(p){addFoodPart(p.f,p.q,why);});return;}
          if(it.n)noteUnknown(it.n,why);
        });
      });
    });
    if(totals.pire)noteUnknown('Pire krompir: za pripravo iz surovin preveri količino krompirja, mleka in smetane.', '');
    var list=Object.keys(totals).map(function(id){return totals[id];});
    list.sort(function(a,b){var c=catOrder(a.cat)-catOrder(b.cat);return c||a.label.localeCompare(b.label,'sl');});
    return {items:list,unknown:unknown};
  }

      h+='<div class="row'+(isDone?' done':'')+'"><button type="button" class="cb" data-act="autoTick" data-id="'+esc(x.f)+'" data-key="'+esc(key)+'" role="checkbox" aria-checked="'+isDone+'" aria-label="Kupljeno: '+esc(x.label)+'">'+(isDone?'✓':'')+'</button>'
         +'<div class="txt"><b>'+esc(x.label)+'</b><span class="note"> · '+esc(sum+rounded)+'</span><small>'+esc(x.reasons.slice(0,3).join('; '))+(x.reasons.length>3?' in še '+(x.reasons.length-3)+' obrokov':'')+'</small></div></div>';

    if(!items.length)h+='<div class="empty">V izbranih obrokih ni živil za nakup.</div>';

  function foodUsedInStructuredRecipes(fid) {
    var inParts=function(it){return Array.isArray(it.parts) && it.parts.some(function(p){return p.f===fid;});};

    if(S.days.some(function(d){return d.meals.some(function(m){return m.items.some(inParts);});}))return true;
    return Object.keys(S.daySwaps||{}).some(function(day){return Object.keys(S.daySwaps[day]||{}).some(function(mid){
      var swap=S.daySwaps[day][mid];return swap && Array.isArray(swap.items) && swap.items.some(inParts);
    });});

  function freezeRefs(f) {

    S.days.forEach(function(d){d.meals.forEach(function(m){m.items.forEach(freeze);});});

    if (a === 'delItem') { var fi=findVisibleItem(id);if(!fi)return;change(function(){fi.list.splice(fi.i,1);},'Jed odstranjena');return; }
    if (a === 'addItem') { var nidv = nid('i'); change(function () { var mm = findMeal(b.dataset.m); var o = { id: nidv, note: '' }; setFood(o, 'skuta'); mm.items.push(o); }); return; }
    if (a === 'delSm') { change(function () { freezeRefs('s:' + id); S.smoothies = S.smoothies.filter(function (s) { return s.id !== id; }); }, 'Smoothie odstranjen'); return; }
    if (a === 'addSm') { var sid = nid('s'); change(function () { S.smoothies.push({ id: sid, n: 'Nov smoothie', ing: '', k: 0, p: 0, c: 0 }); }); var se = $('sn-' + sid); if (se) se.focus(); return; }
    if (a === 'delFood') {
      if(foodUsedInStructuredRecipes(id)){setStatus('Živilo je uporabljeno v shranjenem smutiju ali sestavljenem obroku. Najprej popravi ta recept.');return;}
      change(function(){freezeRefs(id);S.foods=S.foods.filter(function(x){return x.id!==id;});},'Živilo odstranjeno');return;
    }
    if (a === 'addFood') { var fid = nid('f'); editing = true; change(function () { S.foods.push({ id: fid, cat: 'Moje', label: 'Novo živilo', unit: 'g', kcal: 0, p: 0, def: 100 }); foodQ = 'Novo živilo'; }); var fl = $('fl-' + fid); if (fl) { fl.scrollIntoView({ behavior: 'smooth', block: 'center' }); fl.focus({ preventScroll: true }); fl.select(); } return; }
    if (a === 'delX') { var fx = findX(id); change(function () { fx.list.splice(fx.i, 1); }, 'Izdelek odstranjen'); return; }
    if (a === 'addX') { var xid = nid('x'); change(function () { var list = b.dataset.k === 'stock' ? S.stock : S.shop.filter(function (g) { return g.id === b.dataset.k; })[0].items; list.push({ id: xid, n: '', q: '', u: '', p: 0, done: false }); }); var xe = $('xn-' + xid); if (xe) xe.focus(); return; }
    if (a === 'addG') { var gid = nid('g'); change(function () { S.shop.push({ id: gid, g: 'Nova skupina', items: [] }); }); var ge = $('gn-' + gid); if (ge) ge.focus(); return; }
  });

  function onField(e) {
    var t=e.target,id=t.dataset.id;
    if(t.dataset.bcode){barcodeInput=t.value;return;}
    if(t.dataset.bcf){
      if(!barcodeResult)return;
      var property=t.dataset.bcf;
      if(property==='name'||property==='brand')barcodeResult[property]=String(t.value).slice(0,180);
      else if(property==='unit'){
        if(e.type!=='change')return;
        barcodeResult.unit=t.value==='ml'?'ml':'g';
      }else if(['kcal','protein','fat','carbs','fiber','sugars'].indexOf(property)>=0) {
        barcodeResult[property]=t.value===''?null:num(t.value);
      }
      var preview=$('barcodePreview');if(preview)preview.textContent=barcodePreview();
      return;
    }
    if(t.dataset.bcverify){barcodeResult.verification=!!t.checked;return;}
    if(t.dataset.bca){
      if(t.dataset.bca==='day'){
        if(e.type!=='change')return;
        var idx=Number(t.value);if(!Number.isInteger(idx)||idx<0||idx>6)return;
        barcodeDayIdx=idx;barcodeMealId=S.days[idx].meals[0].id;render();return;
      }
      if(t.dataset.bca==='meal'){barcodeMealId=t.value;return;}
      if(t.dataset.bca==='quantity'){
        barcodeAmount=num(t.value);
        var pr=$('barcodePreview');if(pr)pr.textContent=barcodePreview();return;
      }
      if(t.dataset.bca==='eaten'){barcodeEaten=!!t.checked;return;}
    }
    if(t.dataset.target){
      if(e.type!=='change')return;
      var goal=Math.round(num(t.value)), kind=t.dataset.target;
      if(kind==='kcal' && (goal<1000||goal>6000)){setStatus('Vnesi energijski cilj med 1000 in 6000 kcal.');return;}
      if(kind==='protein' && (goal<30||goal>350)){setStatus('Vnesi beljakovinski cilj med 30 in 350 g.');return;}
      if(kind==='kcal'||kind==='protein'){S.targets[kind]=goal;render();save();}
      return;
    }
    if(t.dataset.actualq) {
      if(e.type!=='change'||!canRecordDay())return;
      var fs=findVisibleItem(t.dataset.actualq),v=num(t.value);
      if(!fs||!fs.it.f)return;
      var fd=food(fs.it.f);
      if(!fd || (fd.unit!=='g' && fd.unit!=='ml'))return;
      if(!isFinite(v)||v<0||v>(+fs.it.q||0)){setStatus('Količina mora biti med 0 in načrtovanimi '+fmtN(fs.it.q)+' '+fd.unit+'. Za več uporabi »Dodaj, kar sem jedel«.');return;}
      var date=dateOfIdx(dayIdx),fraction=(+fs.it.q||0)>0?v/(+fs.it.q):0;
      change(function(){if(fraction>0){fs.it.eatenOn=date;fs.it.portion=fraction;}else{delete fs.it.eatenOn;delete fs.it.portion;}});return;
    }
    if(t.dataset.shopopt){
      if(e.type!=='change')return;
      S.shopAutoOptions[t.dataset.shopopt]=!!t.checked;render();save();return;
    }
    if(t.dataset.bf){
      if(!smoothieDraft)return;
      var bf=t.dataset.bf, bi=+t.dataset.bi;
      if(bf==='name'){if(e.type==='input')smoothieDraft.name=t.value;return;}
      if(bf==='wheyK'||bf==='wheyP'){
        if(e.type!=='change')return;
        var f=food('battery_whey');if(!f)return;
        f[bf==='wheyK'?'kcal':'p']=Math.max(0,num(t.value));save();render();return;
      }
      if(e.type!=='change')return;
      if(!smoothieDraft.parts[bi])return;
      if(bf==='food'){smoothieDraft.parts[bi].f=t.value;var fo=food(t.value);smoothieDraft.parts[bi].q=fo?(fo.def||100):100;}
      if(bf==='qty')smoothieDraft.parts[bi].q=Math.max(0,num(t.value));
      render();return;
    }
    if(t.id==='progressDate') {if(e.type!=='change')return;if(t.value>dKey(new Date())){setStatus('Dnevnik počutja je namenjen preteklim in današnjim vnosom.');render();return;}progressDate=t.value;render();return;}
    if(t.id==='weightDate') {weightDate=t.value;return;}
    if(t.id==='weightKg') {weightInput=t.value;return;}
    if(t.dataset.well) {
      if(e.type==='change' && t.type!=='checkbox' && t.tagName!=='SELECT')return;
      if(e.type==='input' && (t.type==='checkbox' || t.tagName==='SELECT'))return;
      var date=progressDate||dKey(new Date());
      if(!S.wellness[date])S.wellness[date]={};
      S.wellness[date][t.dataset.well]=t.type==='checkbox'?!!t.checked:t.value;
      save();return;
    }
    if (t.dataset.portion) {
      if(e.type!=='change'||!canRecordDay())return;
      var fs=findVisibleItem(t.dataset.portion);if(!fs)return;
      var p=Math.max(0,Math.min(1,num(t.value))),key=dateOfIdx(dayIdx);
      change(function(){if(p>0){fs.it.eatenOn=key;fs.it.portion=p;}else{delete fs.it.eatenOn;delete fs.it.portion;}});return;
    }
    if (t.dataset.df) { if (!drinkForm) return; if (t.dataset.df === 'save') drinkForm.save = t.checked; else drinkForm[t.dataset.df] = t.value; return; }
    if (t.dataset.inj) { if (e.type !== 'change') return; S.injDay = +t.value; save(); return; }
    if (t.dataset.rf) { if (e.type === 'change') return; var rr = S.recipes.filter(function (x) { return x.id === id; })[0]; if (!rr) return; var rf = t.dataset.rf; rr[rf] = (rf === 'k' || rf === 'p') ? num(t.value) : t.value; save(); return; }
    if (t.id === 'smallDay') { if (e.type !== 'change') return; dayIdx = +t.value; render(); return; }
    if (t.id === 'foodSearch') { if (e.type !== 'input') return; foodQ = t.value; render(); return; }
    if (t.dataset.wg) { if (e.type !== 'change') return; var g = num(t.value); if (g > 0) { S.waterGoal = Math.round(g * 1000); render(); save(); } return; }
    if (t.dataset.p) { // meal item editor or adder
      var o = t.dataset.p === 'a' ? adder : (findVisibleItem(id) || {}).it;
      if (!o) return;
      var k = t.dataset.k;
      if (k === 'f') { if (e.type !== 'change') return; setFood(o, t.value); if (t.dataset.p === 'e') { render(); save(); } else render(); return; }
      if(k==='q')o.q=Math.max(0,num(t.value));else if(k==='k')o.k=Math.max(0,Math.round(num(t.value)));else if(k==='p')o.p=Math.max(0,num(t.value));else o[k]=t.value;
      var kv = $(t.dataset.p + 'kv-' + id); if (kv) kv.textContent = kvTxt(o);
      if (t.dataset.p === 'a') return; // adder is not saved until "Dodaj"
      updateTotals(); save(); return;
    }
    if (t.dataset.sf) { if (e.type === 'change') return; var s = S.smoothies.filter(function (x) { return x.id === id; })[0]; if (!s) return; var sf = t.dataset.sf; if(s.parts && (sf==='k'||sf==='p'||sf==='ing')){var calc=smMacros(s);s.k=calc.k;s.p=calc.p;delete s.parts;}s[sf]=(sf === 'n' || sf === 'ing') ? t.value : num(t.value);save();return; }
    if (t.dataset.ff) {
      var fd = S.foods.filter(function (x) { return x.id === id; })[0]; if (!fd) return; var ff = t.dataset.ff;
      if (ff === 'cat') { if (e.type !== 'change') return; fd.cat = t.value; render(); save(); return; }
      if (ff === 'unit') { if (e.type !== 'change') return; fd.unit = t.value; fd.def = per(t.value) === 100 ? 100 : 1; save(); return; }
      if (e.type === 'change') return;
      fd[ff]=(ff==='kcal'||ff==='p')?Math.max(0,num(t.value)):t.value;save();return;
    }
    if (e.type === 'change') return;
    if (t.dataset.xf) { var x = findX(id); if (!x) return; x.it[t.dataset.xf] = t.dataset.xf === 'p' ? num(t.value) : t.value; save(); return; }
    if (t.dataset.gf) { var g = S.shop.filter(function (x) { return x.id === id; })[0]; if (g) { g.g = t.value; save(); } }
  }
  app.addEventListener('change', function(e){
    if(e.target.id!=='barcodePhotoInput'||!e.target.files||!e.target.files[0])return;
    barcodePhotoLookup(e.target.files[0]);
  });
  app.addEventListener('change', function (e) {
    if (e.target.id !== 'importFile' || !e.target.files[0]) return;
    var file=e.target.files[0];
    if(file.size && file.size>10*1024*1024){setStatus('Datoteka je večja od 10 MB. Uvoz ni bil izveden.');return;}
    var r=new FileReader();
    r.onload=function(){
      var previous=S, applied=false;
      try {
        var raw=JSON.parse(r.result), d=raw && raw.format==='jedilnik-backup'?raw.data:raw;
        if(!isValidBackup(d))throw Error('Neveljavna struktura');
        if(!window.confirm('Uvoz bo zamenjal trenutne podatke. Pred tem jih lahko izvoziš. Nadaljujem?'))return;
        undo=JSON.stringify(S);S=d;applied=true;prep();render();save();toast('Kopija uvožena');
      } catch(err) {
        if(applied){S=previous;undo=null;render();}
        setStatus('Uvoz ni uspel. Obstoječi podatki so ohranjeni.');
      }
    };
    r.onerror=function(){setStatus('Datoteke ni bilo mogoče prebrati.');};
    r.readAsText(file);
  });
  app.addEventListener('input', onField);
  app.addEventListener('change', onField);

  function updateTotals() {
    if (view !== 'teden') return;
    var d = S.days[dayIdx];
    d.meals.forEach(function(m){
      var actual=$('mk-'+m.id),plan=$('mp-'+m.id);
      if(actual)actual.innerHTML=mealActuallyEatenHtml(m,dayIdx);
      if(plan)plan.textContent='Načrt: ~'+mealK(m,dayIdx)+' kcal';
    });
    var g = $('gauge'); if (g) g.innerHTML = gaugeHtml(dayKD(d), dayP(d));
    var tab = $('tab-' + dayIdx); if (tab) tab.textContent = Math.round(dayKD(d).all)+' kcal';
  }
  $('editBtn').addEventListener('click', function () { editing = !editing; adder = null; if(!editing && view==='info')foodQ=''; if (!local && !editing && saveTimer) { clearTimeout(saveTimer); flush(); } render(); });
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { if(barcodeCameraActive||barcodeCameraLoading)barcodeCameraStop();barcodeOpen=false;view = b.dataset.v; editing = false; adder = null; editMeals = {}; try { localStorage.setItem('jed-view', view); } catch (e) {} render(); window.scrollTo(0, 0); });
  });
  document.addEventListener('visibilitychange', function () { if(document.visibilityState==='hidden')barcodeCameraStop();if (document.visibilityState === 'hidden' && saveTimer && !local) { clearTimeout(saveTimer); flush(); } });

  // ---------- boot ----------
  function showEmpty(msg) { app.innerHTML = '<div class="empty">' + msg + '</div>'; }
  var MSG_OUT = 'Nisi prijavljen v claude.ai. Spremembe se shranijo le začasno in se lahko izgubijo, ko zapreš stran (posebej na iPhonu). Za trajno shranjevanje se v tem brskalniku prijavi v claude.ai z računom, s katerim je bil jedilnik ustvarjen.';
  var MSG_OTHER = 'Prijavljen si z drugim računom, kot je bil ustvarjen ta jedilnik, zato se tvoje spremembe ne shranijo na strežnik (le začasno v tem brskalniku). Odjavi se iz claude.ai in se prijavi z računom, na katerem je jedilnik.';
  function localMode(msg) {
    if (local) return;
    local = true; docRef = null;
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (!isValidBackup(saved)) saved=null; } catch (e) {}
    if (!saved) { try { var old=JSON.parse(localStorage.getItem(LKEY+'-backup') || 'null'); if (isValidBackup(old)) {saved=old;setStatus('Obnovljena rezervna lokalna kopija.');} } catch(e) {} }
    try { S = saved || JSON.parse($('seed').textContent); } catch (e) { S = null; }
    if (!S || !S.days) { showEmpty('Jedilnika ni bilo mogoče naložiti.'); return; }
    prep();
    if (migratedNow) { try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch (e) {} }
    $('nav').hidden = false;
    if (msg) { $('mode').textContent = msg; $('mode').hidden = false; }
    render();
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  localMode('');
})();
</script>
